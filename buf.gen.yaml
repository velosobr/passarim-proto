# buf.gen.yaml — quais "plugins" transformam .proto em código.
version: v2
managed:
  enabled: true
  override:
    # Diz ao gerador qual é o caminho de import Go dos pacotes gerados,
    # assim não precisamos repetir "option go_package" em cada .proto.
    - file_option: go_package_prefix
      value: github.com/velosobr/passarim-proto/gen/go
plugins:
  # Versões FIXAS: o código gerado registra a versão do plugin no cabeçalho.
  # Sem fixar, um lançamento novo do plugin mudaria o código gerado sozinho
  # e o CI ("generated code is up to date") ficaria vermelho sem motivo.
  # Gera as structs Go das mensagens (Species, ListSpeciesRequest, ...).
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  # Gera o cliente e o servidor gRPC (CatalogServiceClient/Server).
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt: paths=source_relative
  # Python: as mensagens (_pb2.py), as dicas de tipo para editores e para o
  # mypy (_pb2.pyi) e o cliente e servidor gRPC (_pb2_grpc.py). Quem usa é o
  # passarim-photo-curator. A versão do protocolbuffers/python acompanha a do
  # pacote "protobuf" do PyPI: v36.2 gera código que exige protobuf >= 7.36.2.
  - remote: buf.build/protocolbuffers/python:v36.2
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: gen/python
  - remote: buf.build/grpc/python:v1.84.0
    out: gen/python
