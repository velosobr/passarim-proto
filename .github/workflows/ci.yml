# CI do passarim-proto: roda em todo push e pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o buf breaking comparar com a main
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0 # mesma versão usada localmente (reprodutível)
          lint: true
          format: true
          # breaking roda SEMPRE:
          #  - em PR, compara com a main;
          #  - em push direto na main, compara com o commit anterior ao push.
          # Assim nenhuma mudança incompatível entra sem ser detectada.
          breaking: true
          breaking_against: ${{ github.event_name == 'pull_request' && format('{0}#branch=main', github.event.repository.clone_url) || format('{0}#ref={1}', github.event.repository.clone_url, github.event.before) }}
          push: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Garante que o código gerado commitado está atualizado com os .proto.
      - name: generated code is up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          buf generate
          git diff --exit-code gen/
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
